name: Playwright production smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate browser test secrets
        shell: bash
        env:
          TEST_EMAIL_1: ${{ secrets.TEST_EMAIL_1 }}
          TEST_PASSWORD_1: ${{ secrets.TEST_PASSWORD_1 }}
          TEST_EMAIL_2: ${{ secrets.TEST_EMAIL_2 }}
          TEST_PASSWORD_2: ${{ secrets.TEST_PASSWORD_2 }}
        run: |
          missing=0
          for name in TEST_EMAIL_1 TEST_PASSWORD_1 TEST_EMAIL_2 TEST_PASSWORD_2; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret $name is missing or empty. Add it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
      - name: Run production smoke tests
        run: npm run test:e2e
        env:
          BASE_URL: https://faith-learner-hub.vercel.app
          TEST_EMAIL_1: ${{ secrets.TEST_EMAIL_1 }}
          TEST_PASSWORD_1: ${{ secrets.TEST_PASSWORD_1 }}
          TEST_EMAIL_2: ${{ secrets.TEST_EMAIL_2 }}
          TEST_PASSWORD_2: ${{ secrets.TEST_PASSWORD_2 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
